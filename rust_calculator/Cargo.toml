[package]
name = "rust_calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Desktop calculator: operators in rows (Rust port of the Python Tkinter calculator)"

[dependencies]
eframe = "0.29"
egui = "0.29"
fancy-regex = "0.13"
egui_extras = { version = "0.29", features = ["image", "file"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]


[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
